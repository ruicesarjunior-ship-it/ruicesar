// ===================== js/config.js =====================

/**
 * Configuração do servidor de sincronização.
 *
 * Já vem preenchida com o projeto Firebase que a Promotoria mantém — o mesmo
 * usado pelo aplicativo de expedição de ofícios. Não é preciso criar nada: todo
 * celular que abrir o endereço já sincroniza, bastando o código e a senha da
 * operação.
 *
 * Sobre a chave abaixo: numa aplicação Firebase de navegador a `apiKey` é
 * pública por natureza — identifica o projeto, não autoriza acesso. A proteção
 * dos dados não depende dela: os registros sobem cifrados com AES-GCM, com
 * chave derivada da SENHA da operação, que nunca sai do aparelho. Ver
 * js/nuvem-firebase.js.
 *
 * Alternativa: para usar um banco próprio no Supabase, preencha SUPABASE_URL e
 * SUPABASE_ANON_KEY (ver supabase/schema.sql). Preenchidos, eles têm prioridade.
 * NUNCA coloque aqui a chave "service_role" do Supabase.
 */

const CONFIG = {
  FIREBASE: {
    apiKey: 'AIzaSyBFZFZMSPYnVpZgAr6x-H4_eilbxdkvxdI',
    authDomain: 'expedicao-promotorias.firebaseapp.com',
    databaseURL: 'https://expedicao-promotorias-default-rtdb.firebaseio.com',
    projectId: 'expedicao-promotorias',

  CODIGO_OPERACAO_PADRAO: '',

// ===================== js/db.js =====================

/**
 * Camada de persistência local (IndexedDB).
 *
 * Todos os dados ficam no próprio aparelho — nada é enviado para servidores.
 * Object stores:
 *   fiscalizacoes: { id, numero, ano, data, hora, municipio, ... }
 *   veiculos:      { id, fiscalizacaoId, ordem, placa, itens, ... }
 *   fotos:         { id, veiculoId, fiscalizacaoId, blob, legenda, criadoEm }
 */

const DB_NAME = 'fte-db';
const DB_VERSION = 1;

let _db = null;

function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('fiscalizacoes')) {
        db.createObjectStore('fiscalizacoes', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('veiculos')) {
        const s = db.createObjectStore('veiculos', { keyPath: 'id' });
        s.createIndex('fiscalizacaoId', 'fiscalizacaoId', { unique: false });
      }
      if (!db.objectStoreNames.contains('fotos')) {
        const s = db.createObjectStore('fotos', { keyPath: 'id' });
        s.createIndex('veiculoId', 'veiculoId', { unique: false });
        s.createIndex('fiscalizacaoId', 'fiscalizacaoId', { unique: false });
      }
    };
    req.onsuccess = () => {
      _db = req.result;
      resolve(_db);
    };
    req.onerror = () => reject(req.error);
  });
}

function tx(store, mode) {
  return openDB().then((db) => db.transaction(store, mode).objectStore(store));
}

function wrap(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function put(store, obj) {
  const s = await tx(store, 'readwrite');
  await wrap(s.put(obj));
  return obj;
}

async function get(store, id) {
  const s = await tx(store, 'readonly');
  return wrap(s.get(id));
}

async function getAll(store) {
  const s = await tx(store, 'readonly');
  return wrap(s.getAll());
}

async function getAllBy(store, index, value) {
  const s = await tx(store, 'readonly');
  return wrap(s.index(index).getAll(value));
}

async function remove(store, id) {
  const s = await tx(store, 'readwrite');
  return wrap(s.delete(id));
}

async function removeAllBy(store, index, value) {
  const itens = await getAllBy(store, index, value);
  await Promise.all(itens.map((i) => remove(store, i.id)));
  return itens.length;
}

function uid(prefix = 'id') {
  const rand = crypto.getRandomValues(new Uint32Array(2));
  return `${prefix}_${Date.now().toString(36)}_${rand[0].toString(36)}${rand[1].toString(36)}`;
}

/** Estimativa de uso de armazenamento, para avisar antes de encher o aparelho. */
async function uso() {
  if (!navigator.storage?.estimate) return null;
  const { usage = 0, quota = 0 } = await navigator.storage.estimate();
  return { usage, quota };
}

/**
 * Captura e tratamento das fotografias.
 *
 * As imagens são redimensionadas e recomprimidas no próprio aparelho antes de
 * serem gravadas, para que uma fiscalização com dezenas de veículos caiba na
 * memória do celular e o relatório final não fique impossível de compartilhar.
 */


const LADO_MAXIMO = 1400; // px
const QUALIDADE = 0.72;

/** Redimensiona/comprime um File de imagem e devolve um Blob JPEG. */
async function comprimir(file) {
  const bitmap = await createImageBitmap(file).catch(() => null);
  if (!bitmap) return file; // formato exótico: grava como veio
  const escala = Math.min(1, LADO_MAXIMO / Math.max(bitmap.width, bitmap.height));
  const w = Math.round(bitmap.width * escala);
  const h = Math.round(bitmap.height * escala);
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
  bitmap.close?.();
  const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', QUALIDADE));
  return blob || file;
}

async function salvarFotos(files, { veiculoId, fiscalizacaoId, itemId = null }) {
  const salvas = [];
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    const blob = await comprimir(file);
    const foto = {
      id: uid('foto'),
      veiculoId,
      fiscalizacaoId,
      itemId,
      blob,
      legenda: '',
      criadoEm: new Date().toISOString(),
    };
    await put('fotos', foto);
    salvas.push(foto);
  }
  return salvas;
}

function fotosDoVeiculo(veiculoId) {
  return getAllBy('fotos', 'veiculoId', veiculoId);
}

function fotosDaFiscalizacao(fiscalizacaoId) {
  return getAllBy('fotos', 'fiscalizacaoId', fiscalizacaoId);
}

function excluirFoto(id) {
  return remove('fotos', id);
}

function atualizarFoto(foto) {
  return put('fotos', foto);
}

/** Converte um Blob em data URL (usado na montagem do relatório e no backup). */
function blobParaDataURL(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error);
    fr.readAsDataURL(blob);
  });
}

async function dataURLParaBlob(dataURL) {
  const resp = await fetch(dataURL);
  return resp.blob();
}

// -------------------------------------------------------------------- placas

function normalizarPlaca(placa) {
  return String(placa || '')
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, '')
    .slice(0, 7);
}

const RE_ANTIGA = /^[A-Z]{3}[0-9]{4}$/;
const RE_MERCOSUL = /^[A-Z]{3}[0-9][A-Z][0-9]{2}$/;

function placaValida(placa) {
  const p = normalizarPlaca(placa);
  return RE_ANTIGA.test(p) || RE_MERCOSUL.test(p);
}

function formatarPlaca(placa) {
  const p = normalizarPlaca(placa);
  return p.length === 7 ? `${p.slice(0, 3)}-${p.slice(3)}` : p;
}

// ------------------------------------------------------------- irregularidades

/** Lista de itens marcados como irregulares em um veículo. */
function irregularidades(veiculo) {
  return ITENS.filter((item) => veiculo.itens?.[item.id]?.status === 'irregular').map((item) => ({
    item,
    obs: (veiculo.itens[item.id].obs || '').trim(),
  }));
}

function contarIrregularidades(veiculo) {
  return irregularidades(veiculo).length;
}

function itensVerificados(veiculo) {
  return Object.values(veiculo.itens || {}).filter((i) => i.status).length;
}

/**
 * Monta o texto do campo "Observações" do relatório, no padrão do modelo:
 * frases separadas por ponto e vírgula, a última ligada por "e", terminando
 * com ponto final.
 */
function frasesIrregularidades(veiculo) {
  const partes = irregularidades(veiculo).map(({ item, obs }) =>
    obs ? `${item.frase} (${obs})` : item.frase
  );
  const extra = (veiculo.obsGerais || '').trim();
  if (extra) partes.push(extra.replace(/\.$/, ''));
  if (!partes.length) return 'Nenhuma irregularidade constatada.';
  let texto;
  if (partes.length === 1) texto = partes[0];
  else texto = `${partes.slice(0, -1).join('; ')}; e ${partes[partes.length - 1]}`;
  return `${texto.charAt(0).toUpperCase()}${texto.slice(1)}.`;
}

/** Estatísticas consolidadas da fiscalização. */
function consolidar(veiculos) {
  const contagem = new Map();
  let totalIrregularidades = 0;
  let regulares = 0;
  for (const v of veiculos) {
    const irr = irregularidades(v);
    if (!irr.length) regulares += 1;
    totalIrregularidades += irr.length;
    for (const { item } of irr) {
      contagem.set(item.id, (contagem.get(item.id) || 0) + 1);
    }
  }
  const ranking = [...contagem.entries()]
    .map(([id, qtd]) => ({ item: ITENS_POR_ID[id], qtd, pct: veiculos.length ? (qtd * 100) / veiculos.length : 0 }))
    .filter((r) => r.item)
    .sort((a, b) => b.qtd - a.qtd || a.item.titulo.localeCompare(b.item.titulo));
  return {
    totalVeiculos: veiculos.length,
    totalIrregularidades,
    regulares,
    irregulares: veiculos.length - regulares,
    autuados: veiculos.filter((v) => v.autuado).length,
    retidos: veiculos.filter((v) => /Retido|Removido|interrompido/i.test(v.medida || '')).length,
    ranking,
  };
}

// --------------------------------------------------------- backup / mesclagem

/** Aplica os dados de um veículo importado sobre a base local. */
async function mesclarVeiculos(fiscalizacaoId, veiculosImportados) {
  const atuais = await listarVeiculos(fiscalizacaoId);
  const porPlaca = new Map(atuais.filter((v) => v.placa).map((v) => [v.placa, v]));
  let novos = 0;
  let atualizados = 0;
  let ignorados = 0;
  const mapaIds = {};
  let ordem = await proximaOrdem(fiscalizacaoId);

  for (const imp of veiculosImportados) {
    const placa = normalizarPlaca(imp.placa);
    const existente = placa ? porPlaca.get(placa) : null;
    if (existente) {
      if ((imp.atualizadoEm || '') > (existente.atualizadoEm || '')) {
        const preservado = { ...imp, id: existente.id, fiscalizacaoId, ordem: existente.ordem };
        await put('veiculos', preservado);
        mapaIds[imp.id] = existente.id;
        atualizados += 1;
      } else {
        mapaIds[imp.id] = existente.id;
        ignorados += 1;
      }
    } else {
      const novoId = uid('veic');
      const copia = { ...imp, id: novoId, fiscalizacaoId, ordem: ordem++, placa };
      await put('veiculos', copia);
      if (placa) porPlaca.set(placa, copia);
      mapaIds[imp.id] = novoId;
      novos += 1;
    }
  }
  return { novos, atualizados, ignorados, mapaIds };
}

/**

 *
 * A estrutura reproduz o padrão do "RELATÓRIO DE FISCALIZAÇÃO – Nº 01/2026",
 * acrescida de quadro-resumo estatístico, anexo fotográfico e campo de

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function dataPorExtenso(iso) {
  if (!iso) return '';
  const [a, m, d] = iso.split('-').map(Number);
  const meses = [
    'janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
    'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro',
  ];
  return `${String(d).padStart(2, '0')} de ${meses[m - 1]} de ${a}`;
}

function dataCurta(iso) {
  if (!iso) return '';
  const [a, m, d] = iso.split('-');
  return `${d}/${m}/${a}`;
}

function num2(n) {
  return String(n).padStart(2, '0');
}

/**
 * Monta o HTML completo do relatório.
 * @param {object} opts.comFotos inclui o anexo fotográfico (data URLs)
 */
async function montarRelatorio(fisc, veiculos, opts = {}) {
  const { comFotos = true } = opts;
  const stats = consolidar(veiculos);

  let fotosPorVeiculo = new Map();
  if (comFotos) {
    const fotos = await fotosDaFiscalizacao(fisc.id);
    for (const f of fotos) {
      if (!fotosPorVeiculo.has(f.veiculoId)) fotosPorVeiculo.set(f.veiculoId, []);
      fotosPorVeiculo.get(f.veiculoId).push(f);
    }
    for (const [id, lista] of fotosPorVeiculo) {
      const comURL = [];
      for (const f of lista.sort((a, b) => (a.criadoEm || '').localeCompare(b.criadoEm || ''))) {
        comURL.push({ ...f, url: await blobParaDataURL(f.blob) });
      }
      fotosPorVeiculo.set(id, comURL);
    }
  }

  const cabecalho = `

      <div class="orgao">${esc(fisc.orgaoMp)}</div>

      abaixo elencados, a fim de averiguar as condições de segurança, a regularidade da documentação,
      o atendimento aos requisitos previstos na legislação de trânsito e demais normas aplicáveis ao
      transporte escolar do município de ${esc(fisc.municipio || '—')}.
    </p>`;

  const identificacao = `
    <table class="dados">
      <tbody>
        <tr><th>DATA</th><td>${esc(dataCurta(fisc.data))}</td></tr>
        <tr><th>HORÁRIO</th><td>${esc(fisc.hora)}</td></tr>
        <tr><th>MUNICÍPIO</th><td>${esc(fisc.municipio)}</td></tr>
        ${fisc.local ? `<tr><th>LOCAL</th><td>${esc(fisc.local)}</td></tr>` : ''}
        <tr><th>QUANTITATIVO DE VEÍCULOS</th><td>${stats.totalVeiculos}</td></tr>
        ${fisc.equipe ? `<tr><th>EQUIPE</th><td>${esc(fisc.equipe)}</td></tr>` : ''}
      </tbody>
    </table>`;

  const resumo = `
    <section>
      <h2>1. SÍNTESE DO RESULTADO</h2>
      <table class="dados">
        <tbody>
          <tr><th>Veículos fiscalizados</th><td>${stats.totalVeiculos}</td></tr>
          <tr><th>Veículos com irregularidades</th><td>${stats.irregulares} (${pct(stats.irregulares, stats.totalVeiculos)})</td></tr>
          <tr><th>Veículos sem irregularidades</th><td>${stats.regulares} (${pct(stats.regulares, stats.totalVeiculos)})</td></tr>
          <tr><th>Total de irregularidades constatadas</th><td>${stats.totalIrregularidades}</td></tr>
          <tr><th>Veículos autuados</th><td>${stats.autuados}</td></tr>
          <tr><th>Veículos retidos/removidos</th><td>${stats.retidos}</td></tr>
        </tbody>
      </table>

      <h3>1.1. Irregularidades por incidência</h3>
      ${
        stats.ranking.length
          ? `<table class="ranking">
              <thead><tr><th>#</th><th>Irregularidade</th><th>Base normativa</th><th>Nat.</th><th>Veíc.</th><th>%</th></tr></thead>
              <tbody>
                ${stats.ranking
                  .map(
                    (r, i) => `<tr>
                      <td>${i + 1}</td>

  const listaVeiculos = `

          const qtdIrr = irregularidades(v).length;
          return `
            <article class="veiculo">
              <h3>Veículo ${num2(v.ordem || i + 1)}</h3>

                  ? `<div class="linha fotos-ref">Registro fotográfico: ${fotos.length} imagem(ns) — Anexo I.</div>`
                  : ''
              }

        })
        .join('')}
    </section>`;

  const conclusao = fisc.conclusao?.trim()
    ? `<section>
         <h2>3. CONCLUSÃO E PROVIDÊNCIAS</h2>
         ${fisc.conclusao
           .trim()
           .split(/\n{2,}/)
           .map((p) => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`)

    : '';

  const anexo =
    comFotos && fotosPorVeiculo.size
      ? `<section class="anexo">
           <h2>ANEXO I — REGISTRO FOTOGRÁFICO</h2>
           ${veiculos
             .map((v, i) => {

               if (!fotos.length) return '';
               return `

                   <div class="grade-fotos">
                     ${fotos
                       .map(
                         (f, j) => `<figure>
                            <img src="${f.url}" alt="Veículo ${num2(v.ordem || i + 1)} foto ${j + 1}">
                            <figcaption>Foto ${j + 1}${f.legenda ? ` — ${esc(f.legenda)}` : ''}</figcaption>
                          </figure>`
                       )
                       .join('')}
                   </div>
                 </div>`;
             })
             .join('')}
         </section>`
      : '';

  const assinaturas = `
    <section class="assinaturas">
      <p class="fecho">Respeitosamente,</p>
      <div class="assinatura">
        <div class="linha-assinatura"></div>
        <div>${esc(fisc.promotor || 'Promotor(a) de Justiça')}</div>
        <div class="cargo">${esc(fisc.promotoria)}</div>

      <div class="assinatura">
        <div class="linha-assinatura"></div>
        <div>Responsável pelo apoio operacional</div>

      </div>
      <p class="rodape-doc">${esc(fisc.municipio || '')}${fisc.municipio ? ', ' : ''}${esc(dataPorExtenso(fisc.data))}.</p>

  return `${cabecalho}${preambulo}${identificacao}${resumo}${listaVeiculos}${conclusao}${anexo}${assinaturas}`;
}

function pct(parte, total) {
  if (!total) return '0%';
  return `${((parte * 100) / total).toFixed(0)}%`;
}

/** Planilha CSV com uma linha por veículo e colunas de irregularidades. */
function gerarCSV(fisc, veiculos, itens) {
  const sep = ';';
  const cabecalho = [
    'Nº', 'Placa', 'Tipo', 'Marca/Modelo', 'Ano', 'Permissionário', 'Rota/Escola',
    'Condutor', 'CPF', 'CNH', 'Categoria', 'Lotação', 'Escolares a bordo',
    'Monitor', 'Qtd. irregularidades', 'Autuado', 'Nº autuação', 'Medida', 'Observações',
    ...itens.map((i) => i.titulo),
  ];
  const linhas = veiculos.map((v) => {
    const base = [
      v.ordem, formatarPlaca(v.placa), v.tipo, v.marcaModelo, v.ano, v.permissionario, v.escolaRota,
      v.condutorNome, v.condutorCpf, v.condutorCnh, v.condutorCategoria, v.lotacao, v.alunosBordo,
      v.monitorPossui ? (v.monitorNome || 'Sim') : 'Não',
      irregularidades(v).length, v.autuado ? 'Sim' : 'Não', v.autuacaoNumero, v.medida,
      frasesIrregularidades(v),
    ];
    const status = itens.map((i) => {
      const s = v.itens?.[i.id];
      if (!s?.status) return '';
      const rotulo = { conforme: 'Conforme', irregular: 'IRREGULAR', na: 'N/A' }[s.status] || '';
      return s.obs ? `${rotulo} - ${s.obs}` : rotulo;
    });
    return [...base, ...status];
  });
  const escapar = (c) => {
    const s = String(c ?? '');
    return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  return `﻿${[cabecalho, ...linhas].map((l) => l.map(escapar).join(sep)).join('\r\n')}`;
}

/**
 * Backup, transferência entre aparelhos e consolidação do trabalho da equipe.
 *
 * Cada integrante da equipe exporta o arquivo .json da sua fiscalização e envia
 * ao coordenador (WhatsApp, e-mail, cabo). O coordenador importa os arquivos:
 * veículos com a mesma placa são consolidados (prevalece a versão mais recente)
 * e os demais entram na sequência.
 */


const FORMATO = 'fte-backup/1';

async function exportar(fiscalizacaoId, { comFotos = true } = {}) {
  const fisc = await obterFiscalizacao(fiscalizacaoId);
  const veiculos = await listarVeiculos(fiscalizacaoId);
  const pacote = { formato: FORMATO, exportadoEm: new Date().toISOString(), fiscalizacao: fisc, veiculos, fotos: [] };
  if (comFotos) {
    const fotos = await fotosDaFiscalizacao(fiscalizacaoId);
    for (const f of fotos) {
      pacote.fotos.push({
        // `origemId` acompanha a foto entre aparelhos e evita duplicação
        // quando o mesmo arquivo é importado mais de uma vez.
        id: f.origemId || f.id,
        veiculoId: f.veiculoId,
        itemId: f.itemId || null,
        legenda: f.legenda || '',
        criadoEm: f.criadoEm,
        dataURL: await blobParaDataURL(f.blob),
      });
    }
  }
  return pacote;
}

/**
 * @param destinoId  fiscalização local que receberá os dados. Se null, cria uma
 *                   nova fiscalização a partir do pacote.
 */
async function importar(pacote, destinoId = null) {
  if (!pacote || pacote.formato !== FORMATO) {
    throw new Error('Arquivo não reconhecido — selecione um backup gerado por este aplicativo.');
  }
  let fisc;
  if (destinoId) {
    fisc = await obterFiscalizacao(destinoId);
  } else {
    fisc = novaFiscalizacao({ ...pacote.fiscalizacao, id: uid('fisc') });
    await salvarFiscalizacao(fisc);
  }

  const { novos, atualizados, ignorados, mapaIds } = await mesclarVeiculos(fisc.id, pacote.veiculos || []);

  let fotosImportadas = 0;
  let fotosRepetidas = 0;
  const jaExistentes = new Map(); // veiculoId -> Set de origens já gravadas
  for (const f of pacote.fotos || []) {
    const veiculoId = mapaIds[f.veiculoId];
    if (!veiculoId) continue;
    if (!jaExistentes.has(veiculoId)) {
      const atuais = await fotosDoVeiculo(veiculoId);
      jaExistentes.set(veiculoId, new Set(atuais.map((x) => x.origemId || x.id)));
    }
    const origens = jaExistentes.get(veiculoId);
    if (origens.has(f.id)) {
      fotosRepetidas += 1;
      continue;
    }
    await put('fotos', {
      id: uid('foto'),
      origemId: f.id,
      veiculoId,
      fiscalizacaoId: fisc.id,
      itemId: f.itemId || null,
      legenda: f.legenda || '',
      criadoEm: f.criadoEm || new Date().toISOString(),
      blob: await dataURLParaBlob(f.dataURL),
    });
    origens.add(f.id);
    fotosImportadas += 1;
  }

  await renumerar(fisc.id);
  return { fiscalizacaoId: fisc.id, novos, atualizados, ignorados, fotos: fotosImportadas, fotosRepetidas };
}

function baixarArquivo(conteudo, nome, tipo) {
  const blob = conteudo instanceof Blob ? conteudo : new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/**
 * Extensões alternativas quando a hospedagem não aceita a original.
 * O relatório .doc é HTML por dentro, então .html preserva o conteúdo.
 */
function alternativas(nome) {
  if (/\.doc$/i.test(nome)) return [nome.replace(/\.doc$/i, '.html')];
  if (/\.csv$/i.test(nome)) return [nome.replace(/\.csv$/i, '.txt')];
  return [];
}

/**
 * Quando o aplicativo roda como página publicada no claude.ai, o navegador
 * bloqueia downloads comuns e a gravação passa por uma confirmação do próprio
 * visualizador. Fora desse ambiente, esta função simplesmente não se aplica.
 */
async function salvarPelaPagina(blob, nome) {
  const api = typeof globalThis.claude !== 'undefined' ? globalThis.claude : null;
  if (!api?.use) return false;
  const downloads = await api.use('downloads').catch(() => null);
  if (!downloads) return false;
  for (const tentativa of [nome, ...alternativas(nome)]) {
    try {
      await downloads.save({ filename: tentativa, data: blob });
      return true;
    } catch (e) {
      // Extensão recusada: tenta a alternativa. Recusa do usuário: respeita.
      if (e?.code === 'rejected_extension' || e?.code === 'extension_not_enabled') continue;
      if (e?.code === 'declined' || e?.code === 'rate_limited') return true;
      return false;
    }
  }
  return false;
}

/** Compartilhamento nativo do celular, com queda para download. */
async function compartilharOuBaixar(conteudo, nome, tipo) {
  const blob = conteudo instanceof Blob ? conteudo : new Blob([conteudo], { type: tipo });
  const file = new File([blob], nome, { type: tipo });
  if (navigator.canShare?.({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: nome });
      return 'compartilhado';
    } catch (e) {
      if (e.name === 'AbortError') return 'cancelado';
    }
  }
  if (await salvarPelaPagina(blob, nome)) return 'salvo';
  baixarArquivo(blob, nome, tipo);
  return 'baixado';
}

/**
 * Transporte de sincronização sobre o Firebase Realtime Database.
 *
 * Escolhido por reaproveitar o projeto Firebase que a Promotoria já mantém,
 * dispensando a criação de qualquer conta nova.
 *
 * SEGURANÇA — por que tudo sobe cifrado:
 * as regras de acesso desse banco não são administradas por este aplicativo, e
 * um banco compartilhado pode ser legível por qualquer sessão anônima. Como os
 * registros contêm dados pessoais de condutores (nome, CPF, CNH) e fotografias,
 * nada trafega em claro:
 *
 *   - a chave de cifra é derivada da SENHA da operação (PBKDF2-SHA256, 150 mil
 *     iterações, sal = código da operação) e nunca sai do aparelho;
 *   - cada registro é cifrado com AES-GCM 256 e vetor de inicialização próprio;
 *   - o próprio caminho no banco é o SHA-256 do código + senha, e as placas
 *     viram hash — nem o endereço do nó revela o que há dentro.
 *
 * Quem não tiver o código e a senha da operação não encontra o nó e, se
 * encontrar, lê apenas bytes embaralhados.
 */

const AUTH_PADRAO = 'https://identitytoolkit.googleapis.com/v1/accounts:signUp';
const REFRESH_PADRAO = 'https://securetoken.googleapis.com/v1/token';
const CHAVE_SESSAO = 'fte:firebaseSessao';

let cfg = null;
const cacheChaves = new Map();

/**
 * @param config {apiKey, databaseURL, authUrl?, refreshUrl?}
 * Os endpoints de autenticação são configuráveis para permitir emuladores e
 * testes automatizados; em produção valem os padrões do Firebase.
 */
function configurarFirebase(config) {
  cfg = config?.apiKey && config?.databaseURL
    ? { authUrl: AUTH_PADRAO, refreshUrl: REFRESH_PADRAO, ...config }
    : null;
  return cfg;
}

function firebaseDisponivel() {
  return !!cfg;
}

// ------------------------------------------------------------- autenticação

async function sessao() {
  let s = null;
  try {
    s = JSON.parse(localStorage.getItem(CHAVE_SESSAO) || 'null');
  } catch {
    s = null;
  }
  if (s?.idToken && s.expiraEm > Date.now() + 60000) return s.idToken;

  if (s?.refreshToken) {
    const nova = await renovar(s.refreshToken).catch(() => null);
    if (nova) return nova;
  }
  return entrarAnonimo();
}

async function entrarAnonimo() {
  const resp = await fetch(`${cfg.authUrl}?key=${cfg.apiKey}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ returnSecureToken: true }),
  });
  const dados = await resp.json();
  if (!resp.ok) {
    throw new Error(
      dados?.error?.message === 'ADMIN_ONLY_OPERATION'
        ? 'O login anônimo está desativado no projeto Firebase. Ative-o em Authentication → Sign-in method.'
        : `Falha ao autenticar no servidor (${dados?.error?.message || resp.status}).`
    );
  }
  guardarSessao(dados.idToken, dados.refreshToken, Number(dados.expiresIn || 3600));
  return dados.idToken;
}

async function renovar(refreshToken) {
  const resp = await fetch(`${cfg.refreshUrl}?key=${cfg.apiKey}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: refreshToken }),
  });
  if (!resp.ok) return null;
  const d = await resp.json();
  guardarSessao(d.id_token, d.refresh_token, Number(d.expires_in || 3600));
  return d.id_token;
}

function guardarSessao(idToken, refreshToken, expiraEmSegundos) {
  localStorage.setItem(
    CHAVE_SESSAO,
    JSON.stringify({ idToken, refreshToken, expiraEm: Date.now() + expiraEmSegundos * 1000 })
  );
}

// ------------------------------------------------------------------- cifra

const texto = new TextEncoder();
const decodificador = new TextDecoder();

function base64(bytes) {
  let s = '';
  for (const b of new Uint8Array(bytes)) s += String.fromCharCode(b);
  return btoa(s);
}

function deBase64(txt) {
  const bin = atob(txt);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
  return out;
}

async function sha256Hex(txt) {
  const buf = await crypto.subtle.digest('SHA-256', texto.encode(txt));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

async function chaveDe(codigo, senha) {
  const id = `${codigo}::${senha}`;
  if (cacheChaves.has(id)) return cacheChaves.get(id);
  const base = await crypto.subtle.importKey('raw', texto.encode(senha), 'PBKDF2', false, ['deriveKey']);
  const chave = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: texto.encode(`fte:${codigo}`), iterations: 150000, hash: 'SHA-256' },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
  cacheChaves.set(id, chave);
  return chave;
}

async function cifrar(valor, chave) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const dados = texto.encode(JSON.stringify(valor));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, chave, dados);
  return `${base64(iv)}.${base64(ct)}`;
}

async function decifrar(pacote, chave) {
  if (typeof pacote !== 'string' || !pacote.includes('.')) return null;
  const [ivB64, ctB64] = pacote.split('.');
  try {
    const claro = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: deBase64(ivB64) },
      chave,
      deBase64(ctB64)
    );
    return JSON.parse(decodificador.decode(claro));
  } catch {
    return null; // senha diferente ou registro corrompido
  }
}

/** Identificador do nó da operação: só quem tem código e senha o encontra. */
async function idSala(codigo, senha) {
  return (await sha256Hex(`fte-sala:${codigo}:${senha}`)).slice(0, 40);
}

/** Placas não podem virar nome de nó — viram hash. */
async function idChave(chave, sala) {
  return (await sha256Hex(`${sala}:${chave}`)).slice(0, 32);
}

// -------------------------------------------------------------- acesso REST

async function db(caminho, { metodo = 'GET', corpo, query = '' } = {}) {
  const token = await sessao();
  const url = `${cfg.databaseURL.replace(/\/+$/, '')}/${caminho}.json?auth=${encodeURIComponent(token)}${query}`;
  let resp;
  try {
    resp = await fetch(url, {
      method: metodo,
      headers: corpo ? { 'Content-Type': 'application/json' } : undefined,
      body: corpo === undefined ? undefined : JSON.stringify(corpo),
    });
  } catch {
    throw new Error('Sem conexão com o servidor.');
  }
  if (resp.status === 401) {
    localStorage.removeItem(CHAVE_SESSAO);
    throw new Error('Sessão expirada — toque em sincronizar novamente.');
  }
  if (resp.status === 403) {
    throw new Error(
      'O banco recusou o acesso. Confira as regras do Realtime Database (é preciso permitir leitura e escrita em "fiscalizacao" para usuários autenticados).'
    );
  }
  if (!resp.ok) throw new Error(`Falha na sincronização (HTTP ${resp.status}).`);
  const txt = await resp.text();
  return txt && txt !== 'null' ? JSON.parse(txt) : null;
}

// ------------------------------------------------------------- o transporte

const transporteFirebase = {
  nome: 'firebase',

  async criar(codigo, senha, fisc) {
    const sala = await idSala(codigo, senha);
    const existente = await db(`fiscalizacao/${sala}/meta`);
    if (existente) {
      throw new Error(`Já existe uma operação com o código ${codigo}. Use "Entrar na operação".`);
    }
    const chave = await chaveDe(codigo, senha);
    await db(`fiscalizacao/${sala}/meta`, {
      metodo: 'PUT',
      corpo: { criadoEm: new Date().toISOString(), versao: 1 },
    });
    await db(`fiscalizacao/${sala}/fisc`, {
      metodo: 'PUT',
      corpo: { cifra: await cifrar(fisc, chave), atualizadoEm: fisc.atualizadoEm || new Date().toISOString() },
    });
    return { codigo };
  },

  async entrar(codigo, senha) {
    const sala = await idSala(codigo, senha);
    const meta = await db(`fiscalizacao/${sala}/meta`);
    if (!meta) throw new Error('Código ou senha da operação inválidos.');
    const chave = await chaveDe(codigo, senha);
    const no = await db(`fiscalizacao/${sala}/fisc`);
    const fiscalizacao = no?.cifra ? await decifrar(no.cifra, chave) : null;
    if (no?.cifra && !fiscalizacao) throw new Error('Senha da operação incorreta.');
    return { codigo, fiscalizacao };
  },

  async sync(codigo, senha, { fisc, veiculos = [], removidos = [], chavesLocais = [] }) {
    const sala = await idSala(codigo, senha);
    const chave = await chaveDe(codigo, senha);

    // As placas viram hash no caminho do banco; para reconhecer as exclusões
    // vindas de outros aparelhos, refaz-se o hash das placas conhecidas aqui.
    const porHash = new Map();
    for (const c of chavesLocais) porHash.set(await idChave(c, sala), c);

    // 1. Estado atual da nuvem.
    const [noFisc, remotos, lapides] = await Promise.all([
      db(`fiscalizacao/${sala}/fisc`),
      db(`fiscalizacao/${sala}/veiculos`),
      db(`fiscalizacao/${sala}/removidos`),
    ]);

    // 2. Exclusões feitas neste aparelho.
    const agora = new Date().toISOString();
    for (const { chave: placa } of removidos) {
      const id = await idChave(placa, sala);
      await db(`fiscalizacao/${sala}/removidos/${id}`, { metodo: 'PUT', corpo: { quando: agora } });
      await db(`fiscalizacao/${sala}/veiculos/${id}`, { metodo: 'DELETE' });
      if (remotos) delete remotos[id];
    }

    // 3. Envio: vence sempre o registro editado por último.
    for (const v of veiculos) {
      const id = await idChave(v.chave, sala);
      const remoto = remotos?.[id];
      if (remoto && (remoto.atualizadoEm || '') >= (v.dados.atualizadoEm || '')) continue;
      const morto = lapides?.[id]?.quando;
      if (morto && morto > (v.dados.atualizadoEm || '')) continue;
      const corpo = {
        cifra: await cifrar({ dados: v.dados, agente: v.agente, chave: v.chave }, chave),
        atualizadoEm: v.dados.atualizadoEm || agora,
      };
      await db(`fiscalizacao/${sala}/veiculos/${id}`, { metodo: 'PUT', corpo });
      if (remotos) remotos[id] = corpo;
    }

    // 4. Cabeçalho da fiscalização.
    let fiscalizacao = noFisc?.cifra ? await decifrar(noFisc.cifra, chave) : null;
    if (fisc && (fisc.atualizadoEm || '') > (noFisc?.atualizadoEm || '')) {
      await db(`fiscalizacao/${sala}/fisc`, {
        metodo: 'PUT',
        corpo: { cifra: await cifrar(fisc, chave), atualizadoEm: fisc.atualizadoEm || agora },
      });
      fiscalizacao = fisc;
    }

    // 5. Devolve o que existe na nuvem para o motor de mesclagem local.
    const saida = [];
    for (const registro of Object.values(remotos || {})) {
      const aberto = await decifrar(registro.cifra, chave);
      if (aberto?.dados) saida.push({ chave: aberto.chave, dados: aberto.dados, agente: aberto.agente || '' });
    }

    const fotos = [];
    const listaFotos = await db(`fiscalizacao/${sala}/fotos`, { query: '&shallow=true' });
    for (const id of Object.keys(listaFotos || {})) fotos.push({ id, origemId: id });

    const removidosSaida = [];
    for (const [id, valor] of Object.entries(lapides || {})) {
      const placa = porHash.get(id);
      if (placa) removidosSaida.push({ chave: placa, quando: valor?.quando || null });
    }

    return { servidorEm: agora, fiscalizacao, veiculos: saida, removidos: removidosSaida, fotos };
  },

  async enviarFoto(codigo, senha, { veiculoChave, origemId, legenda, agente, imagemBase64 }) {
    const sala = await idSala(codigo, senha);
    const chave = await chaveDe(codigo, senha);
    await db(`fiscalizacao/${sala}/fotos/${origemId}`, {
      metodo: 'PUT',
      corpo: {
        cifra: await cifrar({ veiculoChave, legenda, agente, imagem: imagemBase64 }, chave),
        criadoEm: new Date().toISOString(),
      },
    });
  },

  async baixarFoto(codigo, senha, id) {
    const sala = await idSala(codigo, senha);
    const chave = await chaveDe(codigo, senha);
    const no = await db(`fiscalizacao/${sala}/fotos/${id}`);
    if (!no?.cifra) return null;
    const aberto = await decifrar(no.cifra, chave);
    if (!aberto) return null;
    return {
      origemId: id,
      veiculoChave: aberto.veiculoChave,
      legenda: aberto.legenda || '',
      criadoEm: no.criadoEm,
      imagem: aberto.imagem,
    };
  },
};

/** Identificador do nó — exposto para o diagnóstico da tela "Equipe". */
{ idSala };


// ===================== js/nuvem.js =====================

/**
 * Sincronização da equipe.
 *
 * O aplicativo é "offline-first": tudo é gravado primeiro no aparelho. Esta
 * camada empurra o que mudou e traz o que os outros agentes registraram, quando
 * houver sinal. Sem servidor configurado, nada aqui é executado.
 *
 * Há dois transportes possíveis, com a mesma interface:
 *   - Firebase Realtime Database (padrão): reaproveita o projeto que a
 *     Promotoria já mantém; os registros sobem cifrados no próprio aparelho;
 *   - Supabase: banco próprio, com as funções de supabase/schema.sql.
 */


const CHAVE_CFG = 'fte:nuvem';
const LIMITE_FOTOS_POR_SYNC = 8; // evita travar a sincronização numa conexão ruim

configurarFirebase(CONFIG.FIREBASE);

// ------------------------------------------------------------ configuração

/**
 * Configuração vigente. O que foi digitado neste aparelho tem prioridade; na
 * falta dele vale o que está publicado em config.js — assim a equipe abre o
 * endereço e já pode sincronizar, sem digitar nada.
 */
function configNuvem() {
  try {
    const local = JSON.parse(localStorage.getItem(CHAVE_CFG) || 'null');
    if (local?.url && local?.chave) return { ...local, tipo: 'supabase' };
  } catch {
    /* configuração local corrompida: cai para a publicada */
  }
  if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY) {
    return {
      tipo: 'supabase',
      url: CONFIG.SUPABASE_URL.replace(/\/+$/, ''),
      chave: CONFIG.SUPABASE_ANON_KEY,
      publicada: true,
    };
  }
  if (firebaseDisponivel()) {
    return { tipo: 'firebase', url: CONFIG.FIREBASE.databaseURL, publicada: true };
  }
  return null;
}

function definirConfigNuvem(url, chave) {
  if (!url || !chave) {
    localStorage.removeItem(CHAVE_CFG);
    return null;
  }
  const cfg = { url: url.trim().replace(/\/+$/, ''), chave: chave.trim() };
  localStorage.setItem(CHAVE_CFG, JSON.stringify(cfg));
  return cfg;
}

function nuvemConfigurada() {
  return !!configNuvem();
}

function codigoPadrao() {
  return localStorage.getItem('fte:opPadrao') || CONFIG.CODIGO_OPERACAO_PADRAO || '';
}

/**
 * Configuração por link: o coordenador envia um endereço já com o servidor e o
 * código da operação, e o agente só digita a senha. A senha nunca vai no link.
 */
function aplicarConfigDaURL() {
  const p = new URLSearchParams(location.search);
  const srv = p.get('srv');
  const chave = p.get('key');
  const op = p.get('op');
  if (!srv && !chave && !op) return false;
  if (srv && chave) definirConfigNuvem(srv, chave);
  if (op) localStorage.setItem('fte:opPadrao', op.trim().toUpperCase());
  history.replaceState(null, '', location.pathname + location.hash);
  return true;
}

/** Link de configuração para distribuir à equipe (sem a senha). */
function linkConfiguracao(codigoOperacao) {
  const cfg = configNuvem();
  if (!cfg) return null;
  const base = `${location.origin}${location.pathname}`;
  const p = new URLSearchParams();
  if (cfg.tipo === 'supabase' && !cfg.publicada) {
    p.set('srv', cfg.url);
    p.set('key', cfg.chave);
  }
  if (codigoOperacao) p.set('op', codigoOperacao);
  const consulta = p.toString();
  return consulta ? `${base}?${consulta}` : base;
}

// --------------------------------------------------- transporte: Supabase

async function rpc(funcao, params) {
  const cfg = configNuvem();
  let resp;
  try {
    resp = await fetch(`${cfg.url}/rest/v1/rpc/${funcao}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        apikey: cfg.chave,
        Authorization: `Bearer ${cfg.chave}`,
      },
      body: JSON.stringify(params),
    });
  } catch {
    throw new Error('Sem conexão com o servidor.');
  }
  const txt = await resp.text();
  let corpo = null;
  try {
    corpo = txt ? JSON.parse(txt) : null;
  } catch {
    corpo = null;
  }
  if (!resp.ok) throw new Error(corpo?.message || corpo?.hint || `Falha na sincronização (HTTP ${resp.status}).`);
  return corpo;
}

const transporteSupabase = {
  nome: 'supabase',
  async criar(codigo, senha, fisc) {
    await rpc('fisc_criar', { p_codigo: codigo, p_senha: senha, p_dados: fisc });
    return { codigo: codigo.trim().toUpperCase() };
  },
  async entrar(codigo, senha) {
    const r = await rpc('fisc_entrar', { p_codigo: codigo, p_senha: senha });
    return { codigo: String(r.codigo), fiscalizacao: r.fiscalizacao };
  },
  async sync(codigo, senha, { fisc, veiculos, removidos, desde }) {
    const r = await rpc('fisc_sync', {
      p_codigo: codigo,
      p_senha: senha,
      p_fisc: fisc,
      p_veiculos: veiculos,
      p_removidos: removidos,
      p_desde: desde,
    });
    return {
      servidorEm: r.servidorEm,
      fiscalizacao: r.fiscalizacao,
      veiculos: r.veiculos || [],
      removidos: (r.removidos || []).map((chave) => ({ chave, quando: null })),
      fotos: r.fotos || [],
    };
  },
  enviarFoto(codigo, senha, { veiculoChave, origemId, legenda, agente, imagemBase64 }) {
    return rpc('fisc_foto_enviar', {
      p_codigo: codigo,
      p_senha: senha,
      p_veiculo_chave: veiculoChave,
      p_origem_id: origemId,
      p_legenda: legenda,
      p_agente: agente,
      p_imagem: imagemBase64,
    });
  },
  baixarFoto(codigo, senha, id) {
    return rpc('fisc_foto_baixar', { p_codigo: codigo, p_senha: senha, p_id: id });
  },
};

function transporte() {
  const cfg = configNuvem();
  if (!cfg) throw new Error('Servidor de sincronização não configurado.');
  return cfg.tipo === 'firebase' ? transporteFirebase : transporteSupabase;
}

/** Nome amigável do servidor em uso, para a tela "Equipe". */
function servidorEmUso() {
  const cfg = configNuvem();
  if (!cfg) return null;
  return cfg.tipo === 'firebase'
    ? { tipo: 'firebase', descricao: 'Firebase da Promotoria (registros cifrados no aparelho)' }
    : { tipo: 'supabase', descricao: (cfg.url || '').replace(/^https?:\/\//, '') };
}

// ------------------------------------------------------------------ sala

/** Identidade do veículo na nuvem: a placa; sem placa, um identificador local. */
function chaveVeiculo(v) {
  const p = normalizarPlaca(v.placa);
  return p || `local:${v.id}`;
}

function fiscParaNuvem(fisc) {
  const { sala, ...limpo } = fisc; // a senha da operação nunca sobe
  return limpo;
}

async function criarSala(fisc, codigo, senha) {
  const cod = codigo.trim().toUpperCase();
  if (cod.length < 4) throw new Error('O código da operação deve ter ao menos 4 caracteres.');
  if ((senha || '').length < 4) throw new Error('A senha da operação deve ter ao menos 4 caracteres.');
  await transporte().criar(cod, senha, fiscParaNuvem(fisc));
  fisc.sala = { codigo: cod, senha, ultimoSync: null, ultimoEnvio: null, removidos: [] };
  await salvarFiscalizacao(fisc);
  return fisc;
}

async function entrarSala(fiscLocal, codigo, senha) {
  const cod = codigo.trim().toUpperCase();
  const r = await transporte().entrar(cod, senha);
  let fisc = fiscLocal;
  if (!fisc) {
    fisc = novaFiscalizacao({ ...(r.fiscalizacao || {}), id: uid('fisc') });
  } else if (r.fiscalizacao) {
    Object.assign(fisc, r.fiscalizacao, { id: fisc.id });
  }
  fisc.sala = { codigo: String(r.codigo || cod), senha, ultimoSync: null, ultimoEnvio: null, removidos: [] };
  await salvarFiscalizacao(fisc);
  return fisc;
}

async function sairSala(fisc) {
  delete fisc.sala;
  await salvarFiscalizacao(fisc);
  return fisc;
}

/** Registra a exclusão para que ela alcance os demais aparelhos. */
async function marcarRemocao(fisc, veiculo) {
  if (!fisc?.sala) return;
  fisc.sala.removidos = fisc.sala.removidos || [];
  const chave = chaveVeiculo(veiculo);
  if (!fisc.sala.removidos.includes(chave)) fisc.sala.removidos.push(chave);
  await salvarFiscalizacao(fisc);
}

// ---------------------------------------------------------- sincronização

let sincronizando = false;

function estaSincronizando() {
  return sincronizando;
}

/**
 * Envia as alterações locais e aplica as alterações vindas dos demais agentes.
 * @returns {{enviados:number, recebidos:number, apagados:number,
 *            fotosEnviadas:number, fotosRecebidas:number, fotosPendentes:number}}
 */
async function sincronizar(fiscId, { comFotos = true } = {}) {
  if (sincronizando) throw new Error('Sincronização já em andamento.');
  let fisc = await obterFiscalizacao(fiscId);
  if (!fisc?.sala) throw new Error('Esta fiscalização não está vinculada a uma operação em nuvem.');
  sincronizando = true;
  try {
    const { codigo, senha } = fisc.sala;
    // Dois marcadores, porque são dois relógios diferentes: `ultimoSync` é a hora
    // do servidor (define o que baixar) e `ultimoEnvio` é a hora deste aparelho
    // (define o que subir). Misturá-los faria um celular com a hora atrasada
    // parar de enviar os registros.
    const desde = fisc.sala.ultimoSync || null;
    const desdeLocal = fisc.sala.ultimoEnvio || null;
    const inicioLocal = new Date().toISOString();
    const locais = await listarVeiculos(fisc.id);

    const paraEnviar = locais
      .filter((v) => !desdeLocal || (v.atualizadoEm || '') > desdeLocal)
      .map((v) => ({ chave: chaveVeiculo(v), agente: v.inspetor || '', dados: v }));

    const resposta = await transporte().sync(codigo, senha, {
      fisc: fiscParaNuvem(fisc),
      veiculos: paraEnviar,
      removidos: (fisc.sala.removidos || []).map((chave) => ({ chave })),
      chavesLocais: locais.map((v) => chaveVeiculo(v)),
      desde,
    });

    // Cabeçalho da fiscalização — prevalece a versão mais recente.
    if (resposta.fiscalizacao && (resposta.fiscalizacao.atualizadoEm || '') > (fisc.atualizadoEm || '')) {
      const sala = fisc.sala;
      Object.assign(fisc, resposta.fiscalizacao, { id: fisc.id, sala });
    }

    // Exclusões feitas por outros aparelhos.
    let apagados = 0;
    const porChave = new Map(locais.map((v) => [chaveVeiculo(v), v]));
    for (const { chave, quando } of resposta.removidos || []) {
      const alvo = porChave.get(chave);
      if (!alvo) continue;
      if (quando && (alvo.atualizadoEm || '') > quando) continue; // reeditado depois: mantém
      await excluirVeiculo(alvo.id);
      porChave.delete(chave);
      apagados += 1;
    }

    // Veículos vindos da nuvem.
    let recebidos = 0;
    let ordem = await proximaOrdem(fisc.id);
    for (const remoto of resposta.veiculos || []) {
      const dados = remoto.dados;
      const local = porChave.get(remoto.chave);
      if (local) {
        if ((dados.atualizadoEm || '') > (local.atualizadoEm || '')) {
          await put('veiculos', { ...dados, id: local.id, fiscalizacaoId: fisc.id, ordem: local.ordem });
          recebidos += 1;
        }
      } else {
        const novo = { ...dados, id: uid('veic'), fiscalizacaoId: fisc.id, ordem: ordem++ };
        await put('veiculos', novo);
        porChave.set(remoto.chave, novo);
        recebidos += 1;
      }
    }

    let fotosEnviadas = 0;
    let fotosRecebidas = 0;
    let fotosPendentes = 0;
    if (comFotos) {
      const r = await sincronizarFotos(fisc, porChave, resposta.fotos || []);
      fotosEnviadas = r.enviadas;
      fotosRecebidas = r.recebidas;
      fotosPendentes = r.pendentes;
    } else {
      fotosPendentes = (await fotosDaFiscalizacao(fisc.id)).filter((f) => !f.sincronizada).length;
    }

    fisc = await obterFiscalizacao(fisc.id); // recarrega após as gravações acima
    fisc.sala = {
      ...fisc.sala,
      codigo,
      senha,
      ultimoSync: resposta.servidorEm,
      ultimoEnvio: inicioLocal,
      removidos: [],
    };
    await salvarFiscalizacao(fisc);

    return {
      enviados: paraEnviar.length,
      recebidos,
      apagados,
      fotosEnviadas,
      fotosRecebidas,
      fotosPendentes,
    };
  } finally {
    sincronizando = false;
  }
}

async function sincronizarFotos(fisc, porChave, metadadosRemotos) {
  const { codigo, senha } = fisc.sala;
  const locais = await fotosDaFiscalizacao(fisc.id);
  const origensLocais = new Set(locais.map((f) => f.origemId || f.id));

  // Envio (limitado por rodada, para não estourar conexões ruins).
  const pendentes = locais.filter((f) => !f.sincronizada);
  let enviadas = 0;
  const veiculoPorId = new Map([...porChave.values()].map((v) => [v.id, v]));
  for (const f of pendentes.slice(0, LIMITE_FOTOS_POR_SYNC)) {
    const veiculo = veiculoPorId.get(f.veiculoId);
    if (!veiculo) continue;
    const dataURL = await blobParaDataURL(f.blob);
    await transporte().enviarFoto(codigo, senha, {
      veiculoChave: chaveVeiculo(veiculo),
      origemId: f.origemId || f.id,
      legenda: f.legenda || '',
      agente: veiculo.inspetor || '',
      imagemBase64: dataURL.split(',')[1],
    });
    f.sincronizada = true;
    f.origemId = f.origemId || f.id;
    await put('fotos', f);
    enviadas += 1;
  }

  // Recebimento das fotos dos demais agentes.
  let recebidas = 0;
  const novas = metadadosRemotos.filter((m) => !origensLocais.has(m.origemId));
  for (const meta of novas.slice(0, LIMITE_FOTOS_POR_SYNC)) {
    const completa = await transporte().baixarFoto(codigo, senha, meta.id);
    if (!completa?.imagem) continue;
    const veiculo = porChave.get(completa.veiculoChave || meta.veiculoChave);
    if (!veiculo) continue;
    await put('fotos', {
      id: uid('foto'),
      origemId: completa.origemId || meta.origemId,
      veiculoId: veiculo.id,
      fiscalizacaoId: fisc.id,
      itemId: null,
      legenda: completa.legenda || '',
      criadoEm: completa.criadoEm || new Date().toISOString(),
      sincronizada: true,
      blob: await dataURLParaBlob(`data:image/jpeg;base64,${completa.imagem}`),
    });
    recebidas += 1;
  }

  const restantes = pendentes.length - enviadas + Math.max(0, novas.length - recebidas);
  return { enviadas, recebidas, pendentes: restantes };
}

/**
 * Produção por agente, calculada a partir do que já foi consolidado neste
 * aparelho — funciona igual nos dois transportes e também sem sinal.
 */
async function painel(fisc) {
  if (!fisc?.sala) throw new Error('Fiscalização sem operação em nuvem.');
  const veiculos = await listarVeiculos(fisc.id);
  const fotos = await fotosDaFiscalizacao(fisc.id);
  const porAgente = new Map();
  for (const v of veiculos) {
    const nome = (v.inspetor || '').trim() || '(sem identificação)';
    const atual = porAgente.get(nome) || { agente: nome, veiculos: 0, ultimo: null };
    atual.veiculos += 1;
    if (!atual.ultimo || (v.atualizadoEm || '') > atual.ultimo) atual.ultimo = v.atualizadoEm;
    porAgente.set(nome, atual);
  }
  return {
    veiculos: veiculos.length,
    fotos: fotos.length,
    agentes: [...porAgente.values()].sort((a, b) => b.veiculos - a.veiculos),
  };
}

/** Quantidade de registros ainda não enviados (mostrado na barra superior). */
async function pendencias(fisc) {
  if (!fisc?.sala) return null;
  const desde = fisc.sala.ultimoEnvio;
  const veiculos = await listarVeiculos(fisc.id);
  const fotos = await fotosDaFiscalizacao(fisc.id);
  return {
    veiculos: veiculos.filter((v) => !desde || (v.atualizadoEm || '') > desde).length,
    fotos: fotos.filter((f) => !f.sincronizada).length,
  };
}

function toast(msg, tipo = 'ok') {
  const t = document.createElement('div');
  t.className = `toast toast--${tipo}`;
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('visivel'));
  setTimeout(() => {
    t.classList.remove('visivel');
    setTimeout(() => t.remove(), 300);
  }, 3200);
}

function liberarURLs() {
  urlsTemporarias.forEach((u) => URL.revokeObjectURL(u));
  urlsTemporarias = [];
}

function objURL(blob) {
  const u = URL.createObjectURL(blob);
  urlsTemporarias.push(u);
  return u;
}

function ir(rota) {
  location.hash = rota;
}

function campo(label, id, valor, opts = {}) {
  const { tipo = 'text', placeholder = '', inputmode = '', maxlength = '', ajuda = '' } = opts;
  return `
    <label class="campo">
      <span>${esc(label)}</span>
      <input id="${id}" type="${tipo}" value="${esc(valor ?? '')}"
        placeholder="${esc(placeholder)}" ${inputmode ? `inputmode="${inputmode}"` : ''}
        ${maxlength ? `maxlength="${maxlength}"` : ''} autocomplete="off">
      ${ajuda ? `<small>${esc(ajuda)}</small>` : ''}
    </label>`;
}

function area(label, id, valor, linhas = 3) {
  return `
    <label class="campo">
      <span>${esc(label)}</span>
      <textarea id="${id}" rows="${linhas}">${esc(valor ?? '')}</textarea>
    </label>`;
}

function select(label, id, valor, opcoes) {
  return `
    <label class="campo">
      <span>${esc(label)}</span>
      <select id="${id}">
        ${opcoes.map((o) => `<option value="${esc(o)}" ${o === valor ? 'selected' : ''}>${esc(o)}</option>`).join('')}
      </select>
    </label>`;
}

      <div class="cartao-topo">

      ${area('Outras observações (entram no relatório)', 'v_obsGerais', v.obsGerais, 3)}
      <label class="campo linha-check">
        <input type="checkbox" id="v_autuado" ${v.autuado ? 'checked' : ''}>
        <span>Auto de infração lavrado</span>
      </label>

      ${campo('Agente responsável', 'v_inspetor', v.inspetor)}
      <div class="acoes">
        <button class="btn" id="geo">📍 Registrar coordenadas</button>
        <span class="ajuda" id="geo-txt">${v.geo ? `${v.geo.lat.toFixed(5)}, ${v.geo.lng.toFixed(5)}` : 'sem coordenadas'}</span>

function grupoHTML(grupo, v) {
  const itens = ITENS.filter((i) => i.grupo === grupo.id);
  const pendentes = itens.filter((i) => !v.itens?.[i.id]?.status).length;
  const irr = itens.filter((i) => v.itens?.[i.id]?.status === 'irregular').length;
  return `
    <details class="grupo" ${irr ? 'open' : ''}>
      <summary>
        <span>${grupo.icone} ${esc(grupo.titulo)}</span>
        <span class="selos">
          ${irr ? `<span class="selo perigo">${irr}</span>` : ''}
          ${pendentes ? `<span class="selo aviso">${pendentes} pend.</span>` : '<span class="selo ok">ok</span>'}
        </span>
      </summary>
      ${itens.map((i) => itemChecklistHTML(i, v)).join('')}
    </details>`;
}

function itemChecklistHTML(item, v) {
  const estado = v.itens?.[item.id] || {};
  const st = estado.status || '';
  return `
    <div class="item-check" data-item="${item.id}">
      <div class="item-check-titulo">
        <b>${esc(item.titulo)}</b>
        <small>${esc(item.base || '')}${item.gravidade ? ` • ${GRAVIDADE_LABEL[item.gravidade]}` : ''}</small>
        ${item.ajuda ? `<small class="ajuda">${esc(item.ajuda)}</small>` : ''}
      </div>
      <div class="opcoes" role="group">
        <button type="button" class="op ok ${st === 'conforme' ? 'sel' : ''}" data-st="conforme">✓ Conforme</button>
        <button type="button" class="op perigo ${st === 'irregular' ? 'sel' : ''}" data-st="irregular">✗ Irreg.</button>
        <button type="button" class="op ${st === 'na' ? 'sel' : ''}" data-st="na">N/A</button>
      </div>
      <input class="obs-item ${st === 'irregular' ? '' : 'oculto'}" type="text"
        placeholder="Detalhe (opcional): ex. lâmpada traseira esquerda queimada"
        value="${esc(estado.obs || '')}">
    </div>`;
}

function fotoHTML(f) {
  return `
    <figure class="foto" data-foto="${f.id}">
      <img src="${objURL(f.blob)}" alt="Foto do veículo" loading="lazy">
      <input class="legenda" type="text" placeholder="Legenda" value="${esc(f.legenda || '')}">
      <button class="btn icone perigo apagar" aria-label="Excluir foto">🗑</button>
    </figure>`;
}

function ligarFichaVeiculo(v) {
  // Gravação atrasada para não escrever no banco a cada tecla; `salvarAgora`
  // é obrigatório antes de qualquer redesenho da tela, sob pena de a leitura
  // seguinte trazer uma versão desatualizada do veículo.
  const salvarAgora = () => store.salvarVeiculo(v);
  const salvar = debounce(salvarAgora, 300);

  const texto = (id, chave, transform = (x) => x) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', () => {
      v[chave] = transform(el.value);
      salvar();
    });
  };
  texto('v_marcaModelo', 'marcaModelo');
  texto('v_ano', 'ano');
  texto('v_cor', 'cor');
  texto('v_lotacao', 'lotacao');
  texto('v_alunosBordo', 'alunosBordo');
  texto('v_permissionario', 'permissionario');
  texto('v_escolaRota', 'escolaRota');
  texto('v_condutorNome', 'condutorNome');
  texto('v_condutorCpf', 'condutorCpf');
  texto('v_condutorTelefone', 'condutorTelefone');
  texto('v_condutorCnh', 'condutorCnh');
  texto('v_condutorCategoria', 'condutorCategoria', (x) => x.toUpperCase());
  texto('v_condutorValidadeCnh', 'condutorValidadeCnh');
  texto('v_monitorNome', 'monitorNome');
  texto('v_obsGerais', 'obsGerais');
  texto('v_autuacaoNumero', 'autuacaoNumero');
  texto('v_inspetor', 'inspetor');
  document.getElementById('v_tipo').onchange = (e) => { v.tipo = e.target.value; salvar(); };
  document.getElementById('v_medida').onchange = (e) => { v.medida = e.target.value; salvar(); };
  document.getElementById('v_monitorPossui').onchange = (e) => {
    v.monitorPossui = e.target.checked;
    if (e.target.checked) marcarItem(v, 'monitor', 'conforme');
    salvar();
  };
  document.getElementById('v_autuado').onchange = (e) => { v.autuado = e.target.checked; salvar(); };

  // placa com validação e alerta de duplicidade
  const placaEl = document.getElementById('v_placa');
  const avisoEl = document.getElementById('placa-aviso');
  const validarPlaca = async () => {
    const bruta = placaEl.value;
    v.placa = store.normalizarPlaca(bruta);
    salvar();
    if (!v.placa) {
      avisoEl.textContent = 'Informe a placa do veículo.';
      avisoEl.className = 'aviso-txt';
      return;
    }
    if (!store.placaValida(v.placa)) {
      avisoEl.textContent = 'Formato inválido (use ABC1234 ou ABC1D23).';
      avisoEl.className = 'aviso-txt erro';
      return;
    }
    const outros = (await store.listarVeiculos(v.fiscalizacaoId)).filter(
      (o) => o.id !== v.id && o.placa === v.placa
    );
    if (outros.length) {
      avisoEl.textContent = `Atenção: placa já registrada no veículo ${String(outros[0].ordem).padStart(2, '0')}.`;
      avisoEl.className = 'aviso-txt erro';
    } else {
      avisoEl.textContent = 'Placa válida.';
      avisoEl.className = 'aviso-txt ok';
    }
  };
  placaEl.addEventListener('input', () => {
    const p = store.normalizarPlaca(placaEl.value);
    placaEl.value = store.formatarPlaca(p);
    validarPlaca();
  });
  validarPlaca();

  // checklist
  app.querySelectorAll('.item-check').forEach((div) => {
    const itemId = div.dataset.item;
    div.querySelectorAll('.op').forEach((btn) => {
      btn.onclick = () => {
        const novo = btn.classList.contains('sel') ? '' : btn.dataset.st;
        div.querySelectorAll('.op').forEach((b) => b.classList.remove('sel'));
        if (novo) btn.classList.add('sel');
        marcarItem(v, itemId, novo);
        div.querySelector('.obs-item').classList.toggle('oculto', novo !== 'irregular');
        salvar();
        atualizarResumoIrr(v);
        atualizarSelosGrupos(v);
      };
    });
    div.querySelector('.obs-item').addEventListener('input', (e) => {
      marcarItem(v, itemId, v.itens[itemId]?.status || 'irregular', e.target.value);
      salvar();
      atualizarResumoIrr(v);
    });
  });

  document.getElementById('tudo-conforme').onclick = async () => {
    ITENS.forEach((i) => {
      if (!v.itens[i.id]?.status) marcarItem(v, i.id, 'conforme');
    });
    await salvarAgora();
    await viewVeiculo(v.id);
    toast('Itens pendentes marcados como conformes.');
  };

  // fotos
  const receber = async (input) => {
    const arquivos = [...input.files];
    input.value = '';
    if (!arquivos.length) return;
    toast(`Processando ${arquivos.length} foto(s)…`);
    await fotosApi.salvarFotos(arquivos, { veiculoId: v.id, fiscalizacaoId: v.fiscalizacaoId });
    await recarregarFotos(v);
    toast('Foto(s) salva(s).');
  };
  document.getElementById('cam').onchange = (e) => receber(e.target);
  document.getElementById('gal').onchange = (e) => receber(e.target);
  ligarFotos(v);

  document.getElementById('geo').onclick = () => {
    if (!navigator.geolocation) return toast('Geolocalização indisponível.', 'aviso');
    toast('Obtendo coordenadas…');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        v.geo = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
        salvar();
        document.getElementById('geo-txt').textContent = `${v.geo.lat.toFixed(5)}, ${v.geo.lng.toFixed(5)} (±${Math.round(v.geo.acc)} m)`;
      },
      () => toast('Não foi possível obter a localização.', 'aviso'),
      { enableHighAccuracy: true, timeout: 12000 }
    );
  };

  document.getElementById('excluir').onclick = async () => {
    if (!confirm('Excluir este veículo e suas fotos?')) return;
    await nuvem.marcarRemocao(fisc, v); // a exclusão precisa alcançar os demais aparelhos
    await store.excluirVeiculo(v.id);
    await store.renumerar(v.fiscalizacaoId);
    ir('#/veiculos');
    toast('Veículo excluído.', 'aviso');
    sincronizarAgora();
  };
  document.getElementById('concluir').onclick = async () => {
    await store.salvarVeiculo(v);
    ir('#/veiculos');
    sincronizarAgora();
  };
  document.getElementById('proximo').onclick = async () => {
    await store.salvarVeiculo(v);
    criarVeiculo();
    sincronizarAgora();
  };
}

function ligarFotos(v) {
  app.querySelectorAll('.foto').forEach((fig) => {
    const id = fig.dataset.foto;
    fig.querySelector('.apagar').onclick = async () => {
      if (!confirm('Excluir esta foto?')) return;
      await fotosApi.excluirFoto(id);
      await recarregarFotos(v);
    };
    fig.querySelector('.legenda').addEventListener(
      'input',
      debounce(async (e) => {
        const fotos = await fotosApi.fotosDoVeiculo(v.id);
        const f = fotos.find((x) => x.id === id);
        if (f) {
          f.legenda = e.target.value;
          await fotosApi.atualizarFoto(f);
        }
      }, 400)
    );
    fig.querySelector('img').onclick = () => abrirVisualizador(fig.querySelector('img').src);
  });
}

async function recarregarFotos(v) {
  const fotos = await fotosApi.fotosDoVeiculo(v.id);
  const grade = document.getElementById('grade-fotos');
  grade.innerHTML = fotos.map((f) => fotoHTML(f)).join('') || '<p class="vazio">Nenhuma foto.</p>';
  ligarFotos(v);
}

function abrirVisualizador(src) {
  const div = document.createElement('div');
  div.className = 'visualizador';
  div.innerHTML = `<img src="${src}" alt="Ampliação"><button class="btn">Fechar</button>`;
  div.onclick = () => div.remove();
  document.body.appendChild(div);
}

function marcarItem(v, itemId, status, obs) {
  v.itens = v.itens || {};
  const atual = v.itens[itemId] || {};
  if (!status) {
    delete v.itens[itemId];
    return;
  }
  v.itens[itemId] = { status, obs: obs !== undefined ? obs : atual.obs || '' };
}

function atualizarResumoIrr(v) {
  const el = document.getElementById('resumo-irr');
  if (!el) return;
  const irr = store.irregularidades(v);
  el.innerHTML = irr.length
    ? `<b>${irr.length} irregularidade(s).</b> Texto que irá ao relatório:<br><i>${esc(store.frasesIrregularidades(v))}</i>`
    : '<b>Nenhuma irregularidade marcada até o momento.</b>';
  el.className = `resumo-irr ${irr.length ? 'com-irr' : ''}`;
}

function atualizarSelosGrupos(v) {
  app.querySelectorAll('.grupo').forEach((det, idx) => {
    const grupo = GRUPOS[idx];
    if (!grupo) return;
    const itens = ITENS.filter((i) => i.grupo === grupo.id);
    const pendentes = itens.filter((i) => !v.itens?.[i.id]?.status).length;
    const irr = itens.filter((i) => v.itens?.[i.id]?.status === 'irregular').length;
    const selos = det.querySelector('summary .selos');
    selos.innerHTML = `
      ${irr ? `<span class="selo perigo">${irr}</span>` : ''}
      ${pendentes ? `<span class="selo aviso">${pendentes} pend.</span>` : '<span class="selo ok">ok</span>'}`;
  });
}

async function viewRelatorio() {
  if (!fisc) return semFiscalizacao();
  const veiculos = await store.listarVeiculos(fisc.id);
  const pendencias = [];
  const semPlaca = veiculos.filter((v) => !store.placaValida(v.placa));
  if (semPlaca.length) pendencias.push(`${semPlaca.length} veículo(s) com placa ausente ou inválida.`);
  const semVerificacao = veiculos.filter((v) => store.itensVerificados(v) === 0);
  if (semVerificacao.length) pendencias.push(`${semVerificacao.length} veículo(s) sem nenhum item verificado.`);
  if (!fisc.municipio) pendencias.push('Município não informado nos dados da fiscalização.');
  if (!fisc.promotor) pendencias.push('Nome do(a) promotor(a) não informado.');

  app.innerHTML = `
    <section class="cartao">
      <h2>Relatório final</h2>
      <p class="sub">Nº ${esc(fisc.numero)}/${esc(fisc.ano)} — ${veiculos.length} veículo(s).</p>
      ${
        pendencias.length
          ? `<div class="alerta-box"><b>Antes de emitir, confira:</b><ul>${pendencias
              .map((p) => `<li>${esc(p)}</li>`)
              .join('')}</ul></div>`
          : '<div class="ok-box">Dados completos para emissão.</div>'
      }
      <label class="campo linha-check">
        <input type="checkbox" id="com-fotos" checked>
        <span>Incluir anexo fotográfico</span>
      </label>
      <div class="acoes">
        <button class="btn primario grande" id="gerar">👁 Gerar / atualizar</button>
        <button class="btn grande" id="imprimir">🖨 Imprimir / salvar PDF</button>
        <button class="btn" id="doc">📝 Baixar .doc (Word)</button>
        <button class="btn" id="csv">📊 Baixar planilha (CSV)</button>
      </div>
    </section>
    <section class="cartao previa">
      <h3>Pré-visualização</h3>
      <div class="documento" id="previa"><p class="vazio">Toque em “Gerar / atualizar”.</p></div>
    </section>`;

  const comFotos = () => document.getElementById('com-fotos').checked;

  const gerar = async () => {
    toast('Montando relatório…');
    const html = await montarRelatorio(fisc, veiculos, { comFotos: comFotos() });
    document.getElementById('previa').innerHTML = html;
    return html;
  };

  document.getElementById('gerar').onclick = gerar;

  document.getElementById('imprimir').onclick = async () => {
    const html = await gerar();
    areaImpressao.innerHTML = `<div class="documento">${html}</div>`;
    document.body.classList.add('imprimindo');
    setTimeout(() => {
      window.print();
      setTimeout(() => {
        document.body.classList.remove('imprimindo');
        areaImpressao.innerHTML = '';
      }, 800);
    }, 350);
  };

  document.getElementById('doc').onclick = async () => {
    const html = await montarRelatorio(fisc, veiculos, { comFotos: comFotos() });
    const nome = `Relatorio_Fiscalizacao_${fisc.numero}-${fisc.ano}_${(fisc.municipio || 'municipio').replace(/\s+/g, '_')}.doc`;
    await backup.compartilharOuBaixar(
      documentoCompleto(html, `Relatório de Fiscalização nº ${fisc.numero}/${fisc.ano}`),
      nome,
      'application/msword'
    );
  };

  document.getElementById('csv').onclick = async () => {
    const csv = gerarCSV(fisc, veiculos, ITENS);
    await backup.compartilharOuBaixar(
      csv,
      `Fiscalizacao_${fisc.numero}-${fisc.ano}.csv`,
      'text/csv;charset=utf-8'
    );
  };
}

async function viewEquipe() {
  const lista = await store.listarFiscalizacoes();
  app.innerHTML = `
    <div id="area-nuvem"></div>

    <section class="cartao">
      <h2>Backup em arquivo</h2>
      <p class="ajuda">
        Alternativa para quando não houver sinal em campo: cada agente exporta o arquivo
        <b>.json</b> e envia ao coordenador. Ao importar, veículos com a mesma placa são
        consolidados (prevalece a versão mais recente).
      </p>
      ${
        fisc
          ? `<div class="acoes">
               <button class="btn primario" id="exp-fotos">⬆ Exportar com fotos</button>
               <button class="btn" id="exp-sem">⬆ Exportar só dados (leve)</button>
             </div>`
          : '<p class="vazio">Selecione uma fiscalização para exportar.</p>'
      }
    </section>

    <section class="cartao">
      <h3>Importar arquivo</h3>
      <label class="campo">
        <span>Destino</span>
        <select id="destino">
          <option value="">Criar nova fiscalização</option>
          ${lista
            .map(
              (f) => `<option value="${f.id}" ${f.id === fisc?.id ? 'selected' : ''}>Nº ${esc(f.numero)}/${esc(f.ano)} — ${esc(f.municipio || '—')}</option>`
            )
            .join('')}
        </select>
      </label>
      <label class="btn primario arquivo">⬇ Selecionar arquivo .json
        <input type="file" accept="application/json,.json" hidden id="arq">
      </label>
      <div id="resultado-import"></div>
    </section>

    <section class="cartao">
      <h3>Segurança dos dados</h3>
      <p class="ajuda">
        Sem sincronização, os dados ficam apenas neste aparelho e limpar os dados do navegador
        apaga tudo. Exporte um backup ao final de cada dia de fiscalização, mesmo usando a nuvem.
      </p>
    </section>`;

  await renderNuvem();

  document.getElementById('exp-fotos')?.addEventListener('click', () => exportarBackup(true));
  document.getElementById('exp-sem')?.addEventListener('click', () => exportarBackup(false));

  document.getElementById('arq').onchange = async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      toast('Importando…');
      const pacote = JSON.parse(await file.text());
      const destino = document.getElementById('destino').value || null;
      const r = await backup.importar(pacote, destino);
      store.definirFiscalizacaoAtual(r.fiscalizacaoId);
      fisc = await store.obterFiscalizacao(r.fiscalizacaoId);
      document.getElementById('resultado-import').innerHTML = `
        <div class="ok-box">
          Importação concluída: <b>${r.novos}</b> veículo(s) novo(s), <b>${r.atualizados}</b> atualizado(s),
          <b>${r.ignorados}</b> mantido(s) sem alteração e <b>${r.fotos}</b> foto(s).
        </div>`;
      atualizarBarraTopo();
      toast('Importação concluída.');
    } catch (err) {
      document.getElementById('resultado-import').innerHTML = `<div class="alerta-box">${esc(err.message)}</div>`;
    }
  };
}

async function exportarBackup(comFotos) {
  toast('Preparando arquivo…');
  const pacote = await backup.exportar(fisc.id, { comFotos });
  const nome = `fiscalizacao_${fisc.numero}-${fisc.ano}_${(fisc.municipio || 'municipio').replace(/\s+/g, '_')}${comFotos ? '_com_fotos' : ''}.json`;
  await backup.compartilharOuBaixar(JSON.stringify(pacote), nome, 'application/json');
}
